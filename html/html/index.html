<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锦云存储 · 锦云所托，轻而可存</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

<div class="container" id="login-box">
    <h2>锦云存储</h2>
    <p class="slogan">锦云所托，轻而可存。</p>
    <div id="login-error" class="form-error"></div>
    <div class="input-group">
        <input id="login-name" placeholder="用户名or 邮箱" autocomplete="username">
    </div>
    <div class="input-group">
        <div class="password-wrapper">
            <input id="login-password" type="password" placeholder="密码" autocomplete="current-password">
            <i class="password-toggle fa-solid fa-eye" onclick="togglePasswordVisibility('login-password', this)"></i>
        </div>
    </div>
    <button onclick="login()" id="login-button">登录</button>

    <div class="switch">
        还没有账号？<a onclick="showRegister()">立即注册</a>
    </div>
</div>

<div class="container" id="register-box" style="display:none;">
    <h2>创建账号</h2>
    <p class="slogan">锦云所托，轻而可存。</p>
    <div id="register-error" class="form-error"></div>
    <div class="input-group">
        <input id="reg-name" placeholder="设置用户名，避免中文" autocomplete="username">
    </div>
    <div class="input-group">
        <input id="reg-email" placeholder="设置邮箱" autocomplete="email">
    </div>
    <div class="input-group">
        <div class="password-wrapper">
            <input id="reg-password" type="password" placeholder="设置密码" autocomplete="new-password">
            <i class="password-toggle fa-solid fa-eye" onclick="togglePasswordVisibility('reg-password', this)"></i>
        </div>
    </div>
    <div class="input-group">
    <!--<div class="code-wrapper">
        <input id="reg-code" type="text" placeholder="邮箱验证码" maxlength="6" autocomplete="off">
        <button type="button" id="send-code-btn" onclick="sendVerificationCode()">获取验证码</button>
    </div>
    </div>-->
    <button onclick="registerUser()" id="register-button">注册</button>

    <div class="switch">
        已有账号？<a onclick="showLogin()">返回登录</a>
    </div>
</div>

<!-- 以下 script 完全保留，未做任何修改 -->
<script>
let countdown = 60; // 60秒倒计时
let countdownInterval = null;

    function togglePasswordVisibility(inputId, iconElement) {
        const input = document.getElementById(inputId);
        const isPassword = input.type === 'password';
        
        input.type = isPassword ? 'text' : 'password';
        
        iconElement.classList.toggle('fa-eye');
        iconElement.classList.toggle('fa-eye-slash');
    }

    function showRegister() {
        const loginBox = document.getElementById('login-box');
        const registerBox = document.getElementById('register-box');
        loginBox.style.display = 'none';
        registerBox.style.display = 'block';
        registerBox.style.animation = 'none';
        setTimeout(() => registerBox.style.animation = 'fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards', 10);
    }

    function showLogin() {
        const loginBox = document.getElementById('login-box');
        const registerBox = document.getElementById('register-box');
        registerBox.style.display = 'none';
        loginBox.style.display = 'block';
        loginBox.style.animation = 'none';
        setTimeout(() => loginBox.style.animation = 'fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards', 10);
    }
    
    async function login() {
        const nameInput = document.getElementById('login-name');
        const passInput = document.getElementById('login-password');
        const submitBtn = document.getElementById('login-button');
	const errorDiv = document.getElementById('login-error');

	errorDiv.textContent = '';

	const name = nameInput.value.trim();
        const password = passInput.value;

        if (!name || !password) {
            alert("请输入完整信息！");
            return;
        }

        if (submitBtn.disabled) return;

        submitBtn.disabled = true;
        submitBtn.textContent = '登录中…';

        try {
            const res = await fetch('/api/login', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, password })
            });

            const data = await res.json();

            if (res.ok && data.message == "login successful") {
                window.location.href = "/updown.html";
            } else {
                errorDiv.textContent = '用户名或密码错误';
                passInput.value = '';
                nameInput.focus();
	    }
        } catch (error) {
            console.error("登录异常:", error);
            alert("网络错误，请检查连接后重试");
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '登录';
        }
    }
    
async function sendVerificationCode() {
    const emailInput = document.getElementById('reg-email');
    const email = emailInput.value.trim();
    const nameInput = document.getElementById('reg-name');
    const name = nameInput.value.trim();
    const btn = document.getElementById('send-code-btn');
    const errorDiv = document.getElementById('register-error');

    // 清除旧提示
    errorDiv.textContent = '';
    errorDiv.style.color = '#e74c3c'; // 默认红色

    // 前端基础校验（可选，但建议保留作为快速反馈）
    if (!email) {
        errorDiv.textContent = '请先填写邮箱';
        emailInput.focus();
        return;
    }
    if (!name) {
        errorDiv.textContent = '用户名不能为空';
        nameInput.focus();
        return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
        errorDiv.textContent = '邮箱格式不正确';
        emailInput.focus();
        return;
    }
    if (name.length < 3 || name.length > 20) {
        errorDiv.textContent = '用户名必须为 3-20 个字符';
        nameInput.focus();
        return;
    }

    // 防止重复点击
    if (btn.disabled) return;

    try {
        const res = await fetch('/api/email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, name })
        });

        const data = await res.json();

        if (res.ok) {
            // 成功：200 OK
            errorDiv.style.color = '#27ae60';
            errorDiv.textContent = '验证码已发送，请查收（包括垃圾邮件）';

            // 启动倒计时
            countdown = 60;
            btn.disabled = true;
            btn.textContent = `${countdown}s 后重试`;

            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    btn.disabled = false;
                    btn.textContent = '重新获取';
                } else {
                    btn.textContent = `${countdown}s 后重试`;
                }
            }, 1000);
        } else {
            // 处理各种错误
            let msg = data.error || '未知错误，请稍后重试';

            // 可选：针对特定错误做友好提示（非必须，但体验更好）
            if (msg.includes('name has existed')) {
                msg = '该用户名已被注册';
                nameInput.focus();
            } else if (msg.includes('email has existed')) {
                msg = '该邮箱已被注册';
                emailInput.focus();
            } else if (msg.includes('name must be 3-20')) {
                msg = '用户名长度需为 3-20 个字符';
                nameInput.focus();
            } else if (msg.includes('valid email')) {
                msg = '请输入有效的邮箱地址';
                emailInput.focus();
            } else if (msg.includes('send verify failed')) {
                msg = '验证码发送失败，请稍后重试';
            }

            errorDiv.textContent = msg;
        }
    } catch (err) {
        console.error("网络请求失败:", err);
        errorDiv.textContent = '网络错误，请检查连接后重试';
    }
}

</script>

</body>
</html>
