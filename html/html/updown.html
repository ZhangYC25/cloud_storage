<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锦云存储</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/upload.css">
</head>
<body>

<div class="app-layout">
    <div class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-box"></i> 锦云存储
        </div>

        <a id="uploadLink" class="nav-link-item current" onclick="switchPage('uploadPage')">
            <i class="fa-solid fa-cloud-upload-alt"></i> 文件上传
        </a>
        <a id="filesLink" class="nav-link-item" onclick="switchPage('filesPage')">
            <i class="fa-solid fa-folder-open"></i> 我的文件
        </a>
        <a id="profileLink" class="nav-link-item" onclick="switchPage('profilePage')">
            <i class="fa-solid fa-user-circle"></i> 账户
        </a>
    </div>

        <div class="main-content">
            
            <div id="uploadPage" class="page active">
                <h2>文件上传</h2>
                <div class="card">
                    
                    <h3>选择文件</h3>
                    <div class="file-select-wrapper">
                        <span id="fileInputDisplay"><i class="fa-solid fa-file-upload"></i> 点击此处选择文件 或 拖放文件</span>
                        <input type="file" id="fileInput" title="选择要上传的文件" onchange="updateFileNameDisplay(this)">
                    </div>
                    
                    <div class="upload-controls">
                        <button id="uploadBtn" onclick="uploadFile()">上传</button>
                    </div>

                    <div id="uploadResult" class="result-message hidden">
                        </div>

                </div>
            </div>

            <div id="filesPage" class="page">
                <h2>我的文件</h2>
                <div class="card">
                    <button onclick="loadFiles()"><i class="fa-solid fa-sync-alt"></i> 刷新列表</button>

                    <table id="filesTable">
                        <thead>
                            <tr>
                                <th>文件名</th>
                                <th>查看</th>
                                <th>下载</th>
                                <th>删除</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div id="profilePage" class="page">
                <h2>账户信息</h2>
                <div class="card">
                    <p>这里以后可以放昵称、退出登录等内容。</p>
                    <button>退出登录</button>
                </div>
            </div>

        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/spark-md5@3.0.2/spark-md5.min.js"></script>

<script src="js/upload.js"<></script>

</body>
</html>
