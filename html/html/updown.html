<body>

<div class="app-layout">

            <i class="fa-solid fa-box"></i> 锦云存储

        <a id="uploadLink" class="nav-link-item current" onclick="switchPage('uploadPage')">

        <div class="main-content">
            
            <div id="uploadPage" class="page active">
                <h2>文件上传</h2>
                <div class="card">
                    
                    <h3>选择文件</h3>

                        <span id="fileInputDisplay"><i class="fa-solid fa-file-upload"></i> 点击此处选择文件 或 拖放文件</span>

                            <tr>

                                <th>查看</th>

                                <th>删除</th>

                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

            <div id="profilePage" class="page">
                <h2>账户信息</h2>
                <div class="card">
                    <p>这里以后可以放昵称、退出登录等内容。</p>
                    <button>退出登录</button>
                </div>
            </div>

        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/spark-md5@3.0.2/spark-md5.min.js"></script>

<script>
    /*
    * ===============================================
    * 额外的 UI 辅助函数 (非核心逻辑，仅用于显示)
    * ===============================================
    */
    function updateFileNameDisplay(input) {
        const display = document.getElementById('fileInputDisplay');
        if (input.files && input.files.length > 0) {
            display.innerHTML = `<i class="fa-solid fa-file"></i> 已选择: ${input.files[0].name}`;
            document.getElementById('uploadResult').classList.add('hidden'); // 选择新文件时隐藏旧结果
        } else {
            display.innerHTML = `<i class="fa-solid fa-file-upload"></i> 点击此处选择文件 或 拖放文件`;
        }
    }
    
    // 【新增】显示/隐藏结果 UI 的辅助函数
    function displayResult(success, message, url) {
        const resultDiv = document.getElementById('uploadResult');
        resultDiv.classList.remove('hidden');
        
        // 清空现有样式类和颜色
        resultDiv.style.backgroundColor = '';
        resultDiv.style.color = '';
        
        if (success === true) {
            resultDiv.style.backgroundColor = '#e8f5e9';
            resultDiv.style.color = '#2e7d32';
            resultDiv.innerHTML = `
                <h4>✅ 上传成功！</h4>
                <p>${message}</p>
                <p>文件 URL (请保存):</p>
                <span class="url-box">${url}</span>
            `;
        } else if (success === false) {
            resultDiv.style.backgroundColor = '#ffebee'; 
            resultDiv.style.color = '#c62828'; 
            resultDiv.innerHTML = `
                <h4>❌ 上传失败</h4>
                <p>${message}</p>
            `;
        } else { // 用于秒传/已存在等警告信息 (success === null)
            resultDiv.style.backgroundColor = '#fff3e0'; 
            resultDiv.style.color = '#ef6c00'; 
            resultDiv.innerHTML = `
                <h4>⚡ 提示</h4>
                <p>${message}</p>
            `;
        }
    }

    // 页面加载时初始化高亮
    document.addEventListener('DOMContentLoaded', () => {
        // 确保初始页面是 uploadPage 且高亮
        switchPage('uploadPage');
    });

    /*
    * ===============================================
    * 以下是您原始的 JavaScript 代码 (核心逻辑保持不变)
    * ===============================================
    */

    // 切换页面
    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');

        // 切换导航高亮 (适配新的侧边栏结构)
        document.querySelectorAll('.nav-link-item').forEach(link => link.classList.remove('current'));
        document.getElementById(pageId.replace('Page', 'Link')).classList.add('current');
    }

    //计算md5
    async function calcFileMD5(file) {
        console.log("MD5() 被调用了");
		    return new Promise((resolve, reject) => {
    // 处理空文件
        if (file.size === 0) {
          return resolve(SparkMD5.hash(''));
        }

        const chunkSize = 2 * 1024 * 1024; // 2MB
        const chunks = Math.ceil(file.size / chunkSize);
        let currentChunk = 0;
        const spark = new SparkMD5.ArrayBuffer();

        function loadNext() {
          const start = currentChunk * chunkSize;
          const end = Math.min(start + chunkSize, file.size);
          const chunk = file.slice(start, end);

          const reader = new FileReader(); // ← 关键：每次新建
          reader.onload = (e) => {
            spark.append(e.target.result);
            currentChunk++;
            if (currentChunk < chunks) {
              loadNext();
            } else {
              resolve(spark.end());
            }
          };
          reader.onerror = () => reject(new Error("MD5 计算失败"));
          reader.readAsArrayBuffer(chunk);
        }

        loadNext();
      });
    }

function getFileExtension(file) {
    // file 是 File 对象（如从 <input type="file"> 获取的）
    if (!file || !file.name) return '';

    const dotIndex = file.name.lastIndexOf('.');
    if (dotIndex === -1 || dotIndex === file.name.length - 1) {
        return ''; // 没有扩展名 或 以 . 结尾（如 .gitignore）
    }

    return file.name.slice(dotIndex + 1).toLowerCase(); // 返回小写扩展名，如 "jpg"
}
	// ========================
// 大文件分块上传函数
// ========================
	const LARGE_FILE_THRESHOLD = 1024 * 1024; // 1MB
	const CHUNK_SIZE = 256 * 1024; // 0.5MB，必须和后端一致
	const MAX_CONCURRENT = 4;

	async function uploadLargeFile(file, md5) {
    const uploadBtn = document.getElementById('uploadBtn');
	const ext = getFileExtension(file);
	const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
    try {
        // ✅ 使用 POST + JSON，和 /check 保持一致
        const initRes = await fetch("/api/upload/init", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                filename: file.name,
                size: totalChunks,
                md5: md5,
		ext: ext
            })
        });

        if (!initRes.ok) {
            const err = await initRes.json().catch(() => ({}));
            throw new Error(err.message || "初始化上传失败");
        }

        const { upload_id } = await initRes.json();

	    let uploadedCount = 0;

	    // 创建一个队列，并发控制"Content-Type": "application/octet-stream"
	    const uploadChunk = async (i) => {
		const start = i * CHUNK_SIZE;
		const end = Math.min(start + CHUNK_SIZE, file.size);
		const chunk = file.slice(start, end);

		const res = await fetch("/api/upload/chunk", {
		    method: "POST",
		    headers: {
			"X-Upload-ID": upload_id,
			"X-Chunk-Index": i.toString(),
			"Content-Type": "application/octet-stream"
		    },
		    body: chunk
		});

		if (!res.ok) throw new Error(`Chunk ${i} failed`);

		uploadedCount++;
		uploadBtn.textContent = `上传中... (${uploadedCount}/${totalChunks})`;
	    };
	// 并发上传（带并发控制）
	    const chunks = Array.from({ length: totalChunks }, (_, i) => i);
	    for (let i = 0; i < chunks.length; i += MAX_CONCURRENT) {
		const batch = chunks.slice(i, i + MAX_CONCURRENT);
		await Promise.all(batch.map(uploadChunk)); // 等这批全部成功
	    }

        // 完成上传
        uploadBtn.textContent = "请稍候...";
        const finishRes = await fetch("/api/upload/finish", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ upload_id: upload_id })
        });

        if (!finishRes.ok) {
            const err = await finishRes.json().catch(() => ({}));
            throw new Error(err.message || "合并失败");
        }



// 开始轮询查询最终 URL
const MAX_RETRIES = 20;
const RETRY_INTERVAL = 1000; // 1秒
let retries = 0;
while (retries < MAX_RETRIES) {
    try {
        const queryRes = await fetch("/api/upload/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ md5: md5 })
        });
        if (queryRes.ok) {
            const data = await queryRes.json();
            // 假设成功时返回 { url: "..." }，失败时可能返回 { error: ... } 或空
            if (data.url) {
		return data; // 成功拿到 URL
            }
            // 如果返回了错误信息，也可以提前退出
            if (data.error) {
                throw new Error(data.error);
            }
        }
        // 如果没拿到 url，继续重试
    } catch (err) {
        console.warn("Query failed, retrying...", err);
    }
    retries++;
    // 等待一段时间再重试（最后一次不需要等）
    if (retries < MAX_RETRIES) {
        await new Promise(resolve => setTimeout(resolve, RETRY_INTERVAL));
    }
}
// 超时未查到
throw new Error("文件合并超时，请稍后重试或联系管理员");





    } catch (err) {
        console.error("大文件上传出错:", err);
        throw err;
    }
}
	let MAX_FILE_SIZE = 20 * 1024 * 1024;
	// 上传文件
    async function uploadFile() {
	console.log("uploadFile() 被调用了");
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn'); // 假设你有这个按钮
        const file = fileInput.files[0];
        
        // 隐藏旧的上传结果
        document.getElementById('uploadResult').classList.add('hidden'); 

        if (!file) {
            alert("请先选择文件！");
            return;
        }
	if (file.size > MAX_FILE_SIZE) {
		alert("文件不能超过20MB！");
		return;
		}

    // 禁用按钮，防止重复点击
        uploadBtn.disabled = true;
        uploadBtn.textContent = "上传中...";
	//const name = localStorage.getItem('login-name');
        try {
        // 1️⃣ 计算文件 MD5（使用你之前的函数）
            console.log("正在计算文件 MD5，请稍候...");
            const md5 = await calcFileMD5(file);
            console.log("文件 MD5:", md5);

        // 2️⃣ 预检：检查是否已存在
            const checkRes = await fetch("/api/upload/check", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    filename: file.name,
                    md5: md5,
		    //name: name
                    //size: file.size
                })
            });

            const checkData = await checkRes.json();

            if (checkData.status === "already_owned") {
                displayResult(null, "文件已存在，无需上传！", null);
                uploadBtn.disabled = false;
                uploadBtn.textContent = "上传";
                return;
            }

            if (checkData.status === "instant_upload") {
                displayResult(null, "秒传成功！文件已添加到您的网盘。", null);
                uploadBtn.disabled = false;
                uploadBtn.textContent = "上传";
                return;
            }

            if (checkData.status !== "need_upload") {
                throw new Error(checkData.message || "预检失败");
            }

          //3️⃣ 真实上传文件
            const formData = new FormData();
            formData.append("file", file);
            formData.append("filename", file.name);
            formData.append("md5", md5); // 后端可二次校验
	    //formData.append("user", name);

	    const message = '文件：' + file.name;
	if (file.size < LARGE_FILE_THRESHOLD) {
            const uploadRes = await fetch("/api/upload/file", {
                method: "POST",
                body: formData
            });

            const uploadData = await uploadRes.json();

            if (!uploadRes.ok || !uploadData.success) {
                throw new Error(uploadData.message || "上传失败");
             }
	    console.log(uploadData);
            displayResult(true, message, uploadData.url);
	} else {
		console.log("文件较大，启用分块上传...");
    		uploadData = await uploadLargeFile(file, md5);
    		// 模拟老接口返回格式，方便 displayResult 复用	
		console.log(uploadData);
                displayResult(true, message, uploadData.url);
	}
        } catch (err) {
            console.error("上传出错:", err);
            displayResult(false, err.message || "未知错误", null);
        } finally {
          //恢复按钮
            uploadBtn.disabled = false;
            uploadBtn.textContent = "上传";
        // 可选：清空文件选择
          fileInput.value = "";
          updateFileNameDisplay(fileInput); // 清空文件选择后的显示
        }
    }

// 简单的 HTML 转义函数，防止 XSS
    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
	}

    // 加载我的文件
    function loadFiles() {
	fetch(`/api/files`)
	.then(res => {
            if (!res.ok) throw new Error("加载失败");
            return res.json();
        })
        .then(data => {
            let tbody = document.querySelector("#filesTable tbody");
            tbody.innerHTML = "";

            data.forEach(f => {
                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${escapeHtml(f.filename)}</td>
                    <td><a href="${f.url}" target="_blank">查看</a></td>
                    <td><a href="${f.url}" download>下载</a></td>
                    <td><button onclick="deleteFile('${f.id}')">删除</button></td>
                `;
                tbody.appendChild(tr);
            });
        });
	//.catch(err => {
            //console.error(err);
           // alert("加载文件失败");
        //});
    }

	// 删除文件
	function deleteFile(id) {
	  fetch(`/api/delete?id=${encodeURIComponent(id)}`, {
	    method: "DELETE"
	  })
	  .then(res => {
	    // 先判断HTTP响应状态是否正常（比如404、500也会进入then，需要手动处理）
	    if (!res.ok) {
	      // 这里可以抛出自定义错误，让catch捕获
	      throw new Error(`请求失败，状态码：${res.status}`);
	    }
	    return res.json();
	  })
	  .then(data => {
	    // 根据后端返回的success字段判断结果
	    if (data.success) {
	      alert("删除成功");
	      loadFiles(); // 重新加载文件列表
	    } else {
	      // 后端返回失败时，显示后端的message
	      alert(`删除失败：${data.message}`);
	    }
	  })
	  .catch(error => {
	    // 捕获请求异常（比如网络错误、500错误）
	    alert(`操作失败：${error.message || "服务器异常"}`);
	  });
	}

</script>
